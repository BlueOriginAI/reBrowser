name: "Release: BrowserOS Server"

on:
  push:
    tags:
      - "agent-server/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version; allocated automatically when omitted"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to release; defaults to the repository default branch"
        required: false
        type: string
        default: ""
      publish_ota:
        description: "Publish the live alpha-channel server OTA release after finalization"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      mode:
        description: "Build a prepared release or finalize an existing one"
        required: false
        type: string
        default: "build"
      defer_finalize:
        description: "Leave a successful build private for a later finalize call"
        required: false
        type: boolean
        default: false
      state_owner:
        description: "Tracked release-state owner: component or suite"
        required: false
        type: string
        default: "component"
      version:
        description: "Explicit release version; required for finalize mode"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to release; required for finalize mode"
        required: false
        type: string
        default: ""
      publish_ota:
        description: "Publish the live alpha-channel server OTA release after finalization"
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "Prepared server version"
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        description: "Prepared server tag"
        value: ${{ jobs.prepare.outputs.tag }}
      release_sha:
        description: "Immutable source commit"
        value: ${{ jobs.prepare.outputs.release_sha }}
    secrets:
      POSTHOG_API_KEY:
        required: true
      SENTRY_DSN:
        required: true
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-server
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.event_name != 'push' || github.event.deleted != true
    concurrency:
      group: release-component-allocation
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.lifecycle.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      reservation: ${{ steps.release.outputs.reservation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && (github.event.repository.default_branch || 'main') || (inputs.ref || github.event.repository.default_branch || 'main') }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Validate lifecycle inputs
        id: validate
        env:
          MODE: ${{ inputs.mode || 'build' }}
          REF: ${{ inputs.ref || '' }}
          STATE_OWNER: ${{ inputs.state_owner || 'component' }}
          VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ "$MODE" != "build" ] && [ "$MODE" != "finalize" ]; then
            echo "::error::mode must be build or finalize"
            exit 1
          fi
          case "$STATE_OWNER" in
            component|suite) ;;
            *)
              echo "::error::state_owner must be component or suite"
              exit 1
              ;;
          esac
          if [ "$MODE" = "finalize" ] && { [ -z "$VERSION" ] || [ -z "$REF" ]; }; then
            echo "::error::finalize mode requires explicit version and ref inputs"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Resolve release
        id: release
        working-directory: packages/reBrowser
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          uv run browseros release component resolve \
            --component server \
            --event-name "$EVENT_NAME" \
            --default-branch "$DEFAULT_BRANCH" \
            --ref-name "$REF_NAME" \
            --requested-version "$REQUESTED_VERSION" \
            --release-ref HEAD \
            --resource-allocations \
            --repo "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Resolve effective lifecycle mode
        id: lifecycle
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.validate.outputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RESERVATION: ${{ steps.release.outputs.reservation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$RESERVATION" = "tag" ] && \
            [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)" = "false" ]; then
            MODE="finalize"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          changelog="${RUNNER_TEMP}/server-changelog.md"
          notes="${RUNNER_TEMP}/server-release-notes.md"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial BrowserOS Server release." > "$changelog"
          else
            git log "$PREVIOUS_TAG..$RELEASE_SHA" --pretty=format:"- %s (%h)" > "$changelog"
            if [ ! -s "$changelog" ]; then
              echo "No commits since $PREVIOUS_TAG." > "$changelog"
            fi
          fi
          node packages/reBrowser-agent/scripts/release/cap-release-changelog.mjs \
            --input "$changelog" \
            --output "$notes" \
            --max-entries 15 \
            --previous-tag "$PREVIOUS_TAG" \
            --release-tag "$RELEASE_TAG"
          echo "notes=$notes" >> "$GITHUB_ENV"

      - name: Reserve private draft
        if: ${{ steps.lifecycle.outputs.mode == 'build' && steps.release.outputs.reservation != 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          title="BrowserOS Server - v$VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets)"
            is_draft="$(jq -r '.isDraft' <<< "$release")"
            target="$(jq -r '.targetCommitish' <<< "$release")"
            if [ "$is_draft" != "true" ] || [ "$target" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG is not a reusable draft for $RELEASE_SHA"
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --notes-file "$notes"
          fi

  build-publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LOG_LEVEL: info
      NODE_ENV: production
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Preflight required secrets
        run: |
          set -euo pipefail
          required=(POSTHOG_API_KEY SENTRY_DSN)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: packages/reBrowser-agent/package.json

      - name: Install Wine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine
          if ! command -v wine >/dev/null; then
            sudo ln -s /usr/lib/wine/wine64 /usr/local/bin/wine
          fi
          wine --version

      - name: Install browseros-agent dependencies
        working-directory: packages/reBrowser-agent
        run: bun ci

      - name: Stamp release version for artifacts
        working-directory: packages/reBrowser
        run: uv run browseros release component stamp --component server --version "$VERSION"

      - name: Build server resources
        working-directory: packages/reBrowser-agent
        run: bun scripts/build/server.ts --target=all

      - name: Attach zips to private draft
        working-directory: packages/reBrowser-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist/prod/server -maxdepth 1 -name 'browseros-server-resources-*.zip' | sort)
          if [ "${#assets[@]}" -ne 5 ]; then
            echo "::error::Expected 5 server resource zips, found ${#assets[@]}"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "BrowserOS Server - v$VERSION"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  finalize:
    needs:
      - prepare
      - build-publish
    if: ${{ always() && needs.prepare.result == 'success' && (needs.prepare.outputs.mode == 'finalize' || (needs.prepare.outputs.mode == 'build' && inputs.defer_finalize != true && needs.build-publish.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALIAS_TAG: feed-resources-server
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RESERVATION: ${{ needs.prepare.outputs.reservation }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Verify prepared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets)"
          asset_count="$(jq '[.assets[] | select(.name | test("^browseros-server-resources-(darwin-arm64|darwin-x64|linux-arm64|linux-x64|windows-x64)\\.zip$"))] | length' <<< "$release")"
          if [ "$asset_count" -ne 5 ]; then
            echo "::error::Expected 5 draft assets, found $asset_count"
            exit 1
          fi
          if [ "$RESERVATION" != "tag" ]; then
            is_draft="$(jq -r '.isDraft' <<< "$release")"
            target="$(jq -r '.targetCommitish' <<< "$release")"
            if [ "$is_draft" != "true" ] || [ "$target" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG is not the prepared draft for $RELEASE_SHA"
              exit 1
            fi
          fi
          artifact_dir="$RUNNER_TEMP/component-assets"
          mkdir -p "$artifact_dir"
          targets=(darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64)
          for target in "${targets[@]}"; do
            gh release download "$RELEASE_TAG" \
              --pattern "browseros-server-resources-${target}.zip" \
              --dir "$artifact_dir"
          done
          python3 scripts/ci/component_manifest.py \
            --component server \
            --version "$VERSION" \
            --release-sha "$RELEASE_SHA" \
            --assets-dir "$artifact_dir" \
            --output "$artifact_dir/component-manifest.json"

      - name: Create annotated release tag
        run: |
          set -euo pipefail
          git fetch origin --tags --prune
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
              echo "::error::$RELEASE_TAG must be annotated"
              exit 1
            fi
            if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG points at a different source"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "BrowserOS Server - v$VERSION" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish live component resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/component-assets"
          manifest="$artifact_dir/component-manifest.json"
          gh release upload "$RELEASE_TAG" "$manifest" --clobber

          alias_dir="$RUNNER_TEMP/alias-assets"
          mkdir -p "$alias_dir"
          if gh release view "$ALIAS_TAG" >/dev/null 2>&1; then
            gh release download "$ALIAS_TAG" \
              --pattern component-manifest.json --dir "$alias_dir" || true
          fi
          if [ -f "$alias_dir/component-manifest.json" ]; then
            current="$(jq -r '.version' "$alias_dir/component-manifest.json")"
            if [ "$current" = "$VERSION" ]; then
              if [ "$(jq -r '.release_sha' "$alias_dir/component-manifest.json")" != "$RELEASE_SHA" ]; then
                echo "::error::$ALIAS_TAG already binds $VERSION to a different source"
                exit 1
              fi
              echo "$ALIAS_TAG already points at $VERSION"
              exit 0
            fi
            newest="$(printf '%s\n%s\n' "$VERSION" "$current" | sort -V | tail -n 1)"
            if [ "$newest" != "$VERSION" ]; then
              echo "$ALIAS_TAG is already newer at $current; leaving it unchanged"
              exit 0
            fi
          fi

          if ! gh release view "$ALIAS_TAG" >/dev/null 2>&1; then
            gh release create "$ALIAS_TAG" \
              --target "$RELEASE_SHA" \
              --title "Server resources feed" \
              --notes "Managed by the reBrowser release pipeline." \
              --latest=false
          fi
          assets=("$artifact_dir"/*.zip "$manifest")
          gh release upload "$ALIAS_TAG" "${assets[@]}" --clobber

      - name: Publish private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

  publish-ota:
    needs:
      - prepare
      - finalize
    if: ${{ needs.finalize.result == 'success' && github.event_name != 'push' && inputs.publish_ota == true }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-server-ota.yml
    with:
      product: browseros
      version: ${{ needs.prepare.outputs.version }}
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      snapshot_path: updates/server/appcast-server.alpha.xml
    secrets: inherit

  reflect-version:
    needs:
      - prepare
      - finalize
      - publish-ota
    if: ${{ always() && inputs.state_owner != 'suite' && needs.finalize.result == 'success' && (needs.publish-ota.result == 'success' || needs.publish-ota.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Reflect version on main via PR
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          package_json="packages/reBrowser-agent/apps/server/package.json"
          lock="packages/reBrowser-agent/bun.lock"
          branch="chore-bump-server-v${VERSION}"
          git fetch origin "$DEFAULT_BRANCH" --no-tags
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          current="$(jq -er '.version' "$package_json")"
          if [ "$current" != "$VERSION" ]; then
            newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
            if [ "$newest" = "$current" ]; then
              echo "Server source is already newer than released version $VERSION"
              exit 0
            fi
          fi
          uv run --directory packages/reBrowser browseros release component stamp \
            --component server \
            --version "$VERSION"
          if git diff --quiet -- "$package_json" "$lock"; then exit 0; fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            pr_url="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
            if [ -z "$pr_url" ]; then
              pr_url="$(gh pr create --title "chore: bump server version to ${VERSION}" --body "Reflects the published agent-server/v${VERSION} resources." --base "$DEFAULT_BRANCH" --head "$branch")"
            fi
            head_sha="$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')"
            packages/reBrowser-agent/scripts/release/merge-release-pr.sh "$pr_url" "$head_sha"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$package_json" "$lock"
          git commit -m "chore: bump server version to ${VERSION}"
          head_sha="$(git rev-parse HEAD)"
          git push origin "$branch"
          pr_url="$(gh pr create --title "chore: bump server version to ${VERSION}" --body "Reflects the published agent-server/v${VERSION} resources." --base "$DEFAULT_BRANCH" --head "$branch")"
          packages/reBrowser-agent/scripts/release/merge-release-pr.sh "$pr_url" "$head_sha"
